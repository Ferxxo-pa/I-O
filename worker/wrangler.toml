name = "io-mailbox"
main = "src/index.ts"
compatibility_date = "2026-10-01"

# Mailbox only. The shop computer holds the book. This worker does not
# serve the strip, and it does not store names, wages, or Square tokens.
[[d1_databases]]
binding = "DB"
database_name = "io-mailbox"
database_id = "replace-after-wrangler-d1-create"

# Secrets, set with wrangler so they stay out of git:
#   npx wrangler secret put RELAY_SHOP_SECRET --config worker/wrangler.toml
# Optional Square webhook forward. The signature key is not the access token.
# The access token stays on the shop computer.
#   npx wrangler secret put RELAY_SQUARE_WEBHOOK_KEY --config worker/wrangler.toml
# Set the notification URL Square signs as a var, not a secret:
# RELAY_SQUARE_NOTIFICATION_URL = "https://io-mailbox.<subdomain>.workers.dev/square"
