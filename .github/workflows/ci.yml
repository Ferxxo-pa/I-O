name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Pack a throwaway archive
        run: |
          node scripts/pack-release.mjs "$(node -p "require('./package.json').version")"
          test -s SHA256SUMS
          tar -tzf io-*.tar.gz | grep -x dist/version.json
