# Low-cost always-on server. Create the volume before the first deploy:
#   fly volumes create io_data --size 1 --region dfw
# Rename `app` to the name Fly gives you.

app = "io-shop"
primary_region = "dfw"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "5000"
  NODE_ENV = "production"
  DATA_DIR = "/data"

[http_service]
  internal_port = 5000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[http_service.checks]]
  grace_period = "20s"
  interval = "30s"
  method = "GET"
  path = "/api/health"
  timeout = "5s"

[[mounts]]
  source = "io_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
