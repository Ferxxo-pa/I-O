# Copy to /etc/cloudflared/config.yml after `cloudflared tunnel create io`.
# Replace the tunnel id, the credentials file, and the hostname.

tunnel: TUNNEL_ID
credentials-file: /etc/cloudflared/TUNNEL_ID.json

ingress:
  - hostname: io.example.com
    service: http://127.0.0.1:5000
  - service: http_status:404
